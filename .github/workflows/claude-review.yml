name: Claude Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read          # lets Claude read your CI results on the PR
jobs:
  claude-review:          # <-- this job name is the required status check
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth — usage counts against your Max/Pro plan
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Install Anthropic's official PR Review Toolkit into the CI runner.
          plugins: "pr-review-toolkit@claude-plugins-official"
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            The PR branch is already checked out. Run a comprehensive
            pre-merge review using the PR Review Toolkit's agents, covering:
            - Comment Analyzer: docs/comments accurate vs the actual code
            - PR Test Analyzer: test-coverage gaps, prioritized by impact
            - Silent Failure Hunter: hidden error-handling / logging gaps
            - Type Design Analyzer: type invariants and encapsulation
            - Code Reviewer: compliance with project guidelines / CLAUDE.md
            - Code Simplifier: behavior-preserving clarity improvements

            This is a data-driven game engine. In addition to the above, enforce
            these project-specific rules (all are stated in CLAUDE.md):
            - Engine purity: NO Math.random() or Date.now() anywhere in src/**;
              all randomness must flow through src/engine/rng.ts (SPEC-SIM-1).
            - No game content hardcoded in src/engine/**; events, techs, tunable
              numbers, and text belong in content/ governed by schemas/.
            - No inline player-facing strings in logic; they must be localization
              keys resolved from content/localization/ (SPEC-CONTENT-2).
            - Any new/changed content must validate against schemas/ (SPEC-CONTENT-1).
            - Every requirement tagged [testable] in spec/requirements.md must be
              referenced by a test, and each test should cite its SPEC-XXX-N id.
            Read this PR's CI results with `gh pr checks` (jobs: CI, Validate
            Content, Spec Check) and factor any failures into your verdict.

            Post specific findings as inline comments via
            mcp__github_inline_comment__create_inline_comment (confirmed: true).
            Post ONE top-level summary with `gh pr comment`, starting with
            "VERDICT: APPROVE" or "VERDICT: REQUEST_CHANGES".
            Only post GitHub comments — do not return the review as a message.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 25
            --allowedTools "Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*)"
