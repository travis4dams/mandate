name: Spec Check

# The automated "level-set against the spec": every [testable] requirement must be
# referenced by a test. Keeps code and the design spec from drifting apart.
# (Qualitative review of [design] requirements happens in the Claude Review
# workflow — see .github/workflows/claude-review.yml.)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Requirements traceability
        run: npm run spec:trace
